<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dynasty Mover">
<meta name="description" content="Dynasty Mover: the fantasy football trade analyzer, with a GM who knows your league.">
<title>Dynasty Mover</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/retro.css">
<style>
/* The browser draws no bars of its own, so the page keeps clear of the notch and the home bar itself. */
:root{--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
html,body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:var(--bg);color:var(--muted);font:15px/1.4 -apple-system,system-ui,sans-serif;z-index:99}
#boot img{width:72px;height:72px;border-radius:18px}
#boot.gone{display:none}
</style>
</head>
<body>
<div id="boot"><img src="icon.png" alt=""><span>Opening Dynasty Mover…</span></div>
<header class="top">
  <div class="top-row">
    <button class="league-btn" id="leagueBtn" aria-label="Switch league">
      <span class="lg-name" id="lgName">Dynasty Mover</span>
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 8l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <span class="sync hidden" id="sync" role="status" aria-label="Updating"><span class="spin"></span>Updating</span>
    <button class="gm-btn" id="gmBtn" aria-label="Ask your GM"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.2L18 9l-4.2 1.8L12 15l-1.8-4.2L6 9l4.2-1.8zM5 16l.9 2.1L8 19l-2.1.9L5 22l-.9-2.1L2 19l2.1-.9zM19 14l.7 1.6 1.6.7-1.6.7-.7 1.6-.7-1.6-1.6-.7 1.6-.7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>Ask GM</span></button>
  </div>
  <div class="lg-sub" id="lgSub"></div>
</header>

<div id="updbar" class="hidden"></div>
<div id="probar" class="hidden"></div>
<div id="banner" class="banner hidden"></div>

<main id="view"></main>

<nav class="tabs" id="tabs">
  <button data-tab="rank" class="on"><svg viewBox="0 0 24 24"><path d="M9 7a3 3 0 106 0 3 3 0 00-6 0M4 20c0-3.3 3.6-5 8-5s8 1.7 8 5M17.5 4.5a2.6 2.6 0 010 5M20 14.5c1.4.7 2 1.8 2 3.5M6.5 4.5a2.6 2.6 0 000 5M4 14.5c-1.4.7-2 1.8-2 3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Players</span></button>
  <button data-tab="trade"><svg viewBox="0 0 24 24"><path d="M4 8h13l-3-3M20 16H7l3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Trade</span></button>
  <button data-tab="team"><svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 100-8 4 4 0 000 8zM4 21c0-4 4-6 8-6s8 2 8 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>My team</span></button>
  <button data-tab="league"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>League</span></button>
</nav>

<div class="scrim hidden" id="scrim"></div>
<section class="sheet hidden" id="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <div class="sheet-body" id="sheetBody"></div>
</section>
<div class="toast" id="toast" role="status"></div>

<script src="js/edition.js?v=3.2.25.43"></script>
<script src="js/store.js?v=3.2.25.43"></script>
<script>
/* The engine reads its files synchronously, so the stored files are loaded into memory first (Store.ready), then the
   app's scripts run in order, the same order the Android build uses. */
(function () {
  var files = ["predict_params", "engine", "predict", "week", "score", "history", "draft", "faces-data", "pixel", "account", "pro", "update", "ui", "gm"];
  function load(i) {
    if (i >= files.length) { var b = document.getElementById("boot"); if (b) b.classList.add("gone"); return; }
    var s = document.createElement("script"); s.src = "js/" + files[i] + ".js?v=3.2.25.43";
    s.onload = function () { load(i + 1); };
    s.onerror = function () { var b = document.getElementById("boot"); if (b) b.lastChild.textContent = "Couldn't load " + files[i] + ".js. Check the connection and reload."; };
    document.body.appendChild(s);
  }
  Store.ready.then(function () { load(0); }, function () { load(0); });
  if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js?v=3.2.25.43").catch(function () {}); }); }
})();
</script>
</body>
</html>
